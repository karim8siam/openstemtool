<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OpenSTEMTool Logo">
  <defs>
    <linearGradient id="ostBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b222a"/>
      <stop offset="50%" stop-color="#0f2f3a"/>
      <stop offset="100%" stop-color="#143e4c"/>
    </linearGradient>
    <linearGradient id="toolMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ef4df"/>
      <stop offset="50%" stop-color="#56d7c2"/>
      <stop offset="100%" stop-color="#0b8d8e"/>
    </linearGradient>
    <linearGradient id="gradCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#c8f5ed"/>
      <stop offset="100%" stop-color="#6fe2cf"/>
    </linearGradient>
    <linearGradient id="tasselGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe17d"/>
      <stop offset="100%" stop-color="#ef9951"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container background with subtle dual border -->
  <rect width="64" height="64" rx="16" fill="url(#ostBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#255866" stroke-width="1.2" stroke-opacity="0.8"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#087e80" stroke-width="0.75" stroke-opacity="0.3"/>

  <!-- Background subtle coordinate / graph grid lines -->
  <g stroke="#6fe2cf" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 3">
    <line x1="12" y1="32" x2="52" y2="32"/>
    <line x1="32" y1="12" x2="32" y2="52"/>
    <circle cx="32" cy="32" r="18" fill="none"/>
  </g>

  <!-- Compass / Caliper measuring arc (Protractor) with graduation ticks -->
  <path d="M 21.5 43 A 17 17 0 0 1 42.5 43" fill="none" stroke="#3aa799" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Protractor graduation ticks -->
  <g stroke="#8ef4df" stroke-width="1.2" stroke-linecap="round">
    <line x1="24.5" y1="39.5" x2="25.5" y2="42"/>
    <line x1="28" y1="37.2" x2="28.5" y2="39.8"/>
    <line x1="32" y1="36.5" x2="32" y2="39.5"/>
    <line x1="36" y1="37.2" x2="35.5" y2="39.8"/>
    <line x1="39.5" y1="39.5" x2="38.5" y2="42"/>
  </g>

  <!-- Compass / Caliper divider legs (Tools of precision & calculation) -->
  <!-- Left Leg -->
  <path d="M 31 25.5 L 20 50.5 L 18.5 54 L 21 51.5 L 29.5 28.5 Z" fill="url(#toolMetal)"/>
  <!-- Right Leg -->
  <path d="M 33 25.5 L 44 50.5 L 45.5 54 L 43 51.5 L 34.5 28.5 Z" fill="url(#toolMetal)"/>

  <!-- Compass Adjustment Wheel / Pivot Screw -->
  <line x1="25" y1="33" x2="39" y2="33" stroke="#8ef4df" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="32" cy="33" r="2.2" fill="#0b222a" stroke="#8ef4df" stroke-width="1.5"/>

  <!-- Compass Hinge Joint -->
  <circle cx="32" cy="25" r="3.5" fill="#143e4c" stroke="#8ef4df" stroke-width="1.8"/>
  <circle cx="32" cy="25" r="1.4" fill="#6fe2cf"/>

  <!-- Education Symbol: Academic Graduation Cap (Mortarboard) topping the instrument -->
  <!-- Skull cap base -->
  <path d="M 24.5 18 C 24.5 22 39.5 22 39.5 18 Z" fill="#0c2c36" stroke="#56d7c2" stroke-width="1"/>
  <!-- Mortarboard Diamond Top -->
  <polygon points="32,9 47,15.5 32,22 17,15.5" fill="url(#gradCap)" filter="url(#glow)"/>
  <polygon points="32,10.2 45,15.5 32,20.8 19,15.5" fill="#0d2832" opacity="0.15"/>

  <!-- Cap Button & Golden Tassel -->
  <circle cx="32" cy="15.5" r="1.5" fill="#ffe17d"/>
  <!-- Tassel Ribbon & Fringed Tip -->
  <path d="M 32 15.5 Q 26 17 21 21.5 L 20.5 25.5" fill="none" stroke="url(#tasselGold)" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="20.5" cy="26" r="1.4" fill="#ffd56b"/>

  <!-- Spark of Discovery / Educational Star at Compass needle vertex -->
  <circle cx="32" cy="46" r="1.5" fill="#6fe2cf" filter="url(#glow)"/>
</svg>
